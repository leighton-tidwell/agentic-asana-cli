name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:api-coverage
      - run: npm run test:packaging
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Build installable npm artifact
        run: mkdir -p release && npm pack --pack-destination release
      - name: Probe packed CLI entrypoint
        run: |
          npm install --prefix "$RUNNER_TEMP/asn-install" --global ./release/*.tgz
          test "$("$RUNNER_TEMP/asn-install/bin/asn" --version)" = "$(node -p "require('./package.json').version")"
      - name: Normalize artifact name
        run: mv release/*.tgz release/agentic-asana-asn.tgz
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v2
        with:
          subject-path: release/agentic-asana-asn.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-asana-asn-${{ github.ref_name }}
          path: release/agentic-asana-asn.tgz
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release/agentic-asana-asn.tgz
