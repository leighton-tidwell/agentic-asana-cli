name: Asana OpenAPI drift

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh specification and generated catalog
        run: |
          npm run spec:update
          npm run codegen
          npm run test:api-coverage
      - name: Open drift pull request
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v7
        with:
          branch: automation/asana-openapi-drift
          delete-branch: true
          commit-message: 'chore: sync Asana OpenAPI specification'
          title: 'chore: sync Asana OpenAPI specification'
          body: |
            Automated weekly refresh of Asana's official OpenAPI specification.

            Review the operation coverage count and generated manifest diff before merging.
          labels: dependencies,openapi
