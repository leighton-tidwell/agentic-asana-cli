# Deploy the VitePress docs site to GitHub Pages.
#
# Triggers on pushes to main that touch docs/ or this workflow file, and on
# manual dispatch. Builds the site (including llms.txt generation) and publishes
# the static output to the GitHub Pages project site:
#   https://leighton-tidwell.github.io/agentic-asana-cli/
#
# Rollback: re-run this workflow from a previous commit on main (Actions tab →
# "Deploy Docs" → Run workflow → choose the commit), or revert the triggering
# commit and push — the next run will redeploy the prior state. You can also
# disable Pages from repo Settings → Pages if an immediate takedown is needed.

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-commands-doc.mjs'
      - 'gen/manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build docs site (includes llms.txt generation)
        run: npm run docs:build

      - name: Verify llms.txt exists in build output
        run: |
          test -f docs/site/.vitepress/dist/llms.txt
          test -f docs/site/.vitepress/dist/sitemap.xml
          echo "llms.txt and sitemap.xml present in build output"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e7430d281760c9a525f8a9c38c0d8e0e # v3
        with:
          path: docs/site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2bceaed503966d2c16119d5 # v4
